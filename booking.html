<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Book an exchange — Darlington West</title>
<style>
  :root{
    --paper:#f1f3f5;--panel:#fff;--ink:#1b2430;--ink-soft:#4c5766;--rule:#d7dbe0;
    --ok:#2f7a4d;--ok-bg:#eaf3ee;--bad:#b4432f;--bad-bg:#f8ebe8;--accent:#2f5d7a;--accent-bg:#eaf1f5;
    --taken:#c65f4f;--taken-bg:#fbeae7;--cooldown:#c68a3f;--cooldown-bg:#fbf1e0;
    --avail-bg:#eef6f0;--past-bg:#eceef0;--past-ink:#9aa3ad;
    --fh:Georgia,'Iowan Old Style','Times New Roman',serif;
    --fb:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 80px}
  h1{font-family:var(--fh);font-weight:400;font-size:24px;margin:0 0 4px}
  h2{font-family:var(--fh);font-weight:400;font-size:19px;margin:0 0 10px}
  .sub{color:var(--ink-soft);font-size:13px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:18px}
  button{font-family:var(--fb);font-size:15px;border:1px solid var(--ink);border-radius:6px;padding:10px 18px;background:var(--ink);color:#fff;cursor:pointer}
  button:hover{opacity:.9}
  button:disabled{opacity:.45;cursor:default}
  button.secondary{background:var(--panel);color:var(--ink);border-color:var(--rule)}
  button.danger{background:var(--bad);border-color:var(--bad)}
  button.small{padding:6px 12px;font-size:13px}
  textarea,input[type=text],select{width:100%;font-family:var(--fb);font-size:15px;border:1px solid var(--rule);border-radius:6px;padding:9px 11px;background:var(--panel);color:var(--ink)}
  label{font-size:13px;color:var(--ink-soft);display:block;margin-bottom:5px}
  .loading,.err-box{padding:40px 0;text-align:center;color:var(--ink-soft)}
  .banner{padding:11px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .banner.err{background:var(--bad-bg);color:var(--bad)}

  /* Hero */
  .hero{background:var(--accent-bg);border:1px solid #c9dae3;border-radius:8px;padding:20px;margin-bottom:20px}
  .hero .eyebrow{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  .hero h2{color:var(--accent);margin-bottom:2px}
  .hero .open-count{font-size:13px;color:var(--ink-soft);margin-bottom:14px}

  /* Calendar */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-nav button{padding:7px 12px}
  .cal-year{font-family:var(--fh);font-size:18px}
  .cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cal-month{border-radius:6px;padding:12px 8px;text-align:center;font-size:14px;cursor:pointer;border:1px solid transparent;user-select:none}
  .cal-month.available{background:var(--avail-bg);border-color:#cfe3d5}
  .cal-month.taken{background:var(--taken-bg);color:var(--taken);cursor:default}
  .cal-month.cooldown{background:var(--cooldown-bg);color:var(--cooldown);cursor:default}
  .cal-month.past{background:var(--past-bg);color:var(--past-ink);cursor:default}
  .cal-month.selected{outline:2px solid var(--accent);outline-offset:1px}
  .cal-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-soft);margin-top:12px}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* Month preview */
  .preview{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
  .sun-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid #eef0f2}
  .sun-row:last-child{border-bottom:none}
  .sun-row .blocked{color:var(--bad);font-size:12.5px}

  /* Current bookings */
  select.booking-select{margin-bottom:14px}
  .detail-status{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:10px;margin-bottom:12px}
  .detail-status.pencilled{background:var(--cooldown-bg);color:var(--cooldown)}
  .detail-status.pairing_confirmed{background:var(--ok-bg);color:var(--ok)}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:14px;padding:9px 12px;border-radius:6px}
  .check-row.done{background:var(--ok-bg);color:var(--ok)}
  .check-row.pending{background:var(--cooldown-bg);color:var(--cooldown)}
  .slot-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #eef0f2;font-size:14px;gap:10px}
  .slot-row:last-child{border-bottom:none}
  .slot-tag{font-size:11.5px;color:var(--ink-soft)}
  .slot-tag.blocked{color:var(--bad)}
  .slot-tag.no_speaker{color:var(--ink-soft)}
  .slot-tag.two_way,.slot-tag.visiting_only,.slot-tag.sending_only{color:var(--ok)}
  .add-block{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule)}
  .add-block .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .add-block select{flex:1;min-width:120px}
  .add-block input{flex:2;min-width:150px}
  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  a.link-btn{font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline}

  @media (max-width:480px){
    .cal-grid{grid-template-columns:repeat(2,1fr)}
    .action-row{flex-direction:column}
    .action-row button{width:100%}
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('t') || '';
const URL_MODE = params.get('mode');
const URL_MX = params.get('mx');
const URL_CLAIM = params.get('claim'); // round-robin: freed month to highlight, YYYY-MM-01
const API = 'https://wgwmmxxryoyaiymrsyup.supabase.co/functions/v1';
const app = document.getElementById('app');

let data = null;         // last booking-options payload
let calYear = null;      // year currently shown in calendar
let selectedPreviewMonth = null;
let view = URL_MODE === 'cancel' && URL_MX ? { mode: 'cancel', mx: URL_MX }
         : URL_MODE === 'details' ? { mode: 'details' }
         : { mode: 'hub' };
if (URL_MODE === 'speakers' && URL_MX) expandedBooking = URL_MX;
let expandedBooking = null; // mx_id currently expanded in current-bookings
let scrolledToSpeakers = false;

function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function monthLabelFromValue(v){const M=['January','February','March','April','May','June','July','August','September','October','November','December'];const [y,m]=v.split('-').map(Number);return `${M[m-1]} ${y}`;}

async function load(year, previewMonth){
  if(!TOKEN){app.innerHTML='<h1>Book an exchange</h1><div class="err-box">This page needs a valid link. Check the email you were sent, or ask Matt for a fresh one.</div>';return;}
  let q = `?t=${encodeURIComponent(TOKEN)}`;
  if(year) q += `&year=${year}`;
  if(previewMonth) q += `&preview_month=${previewMonth}`;
  try{
    const res = await fetch(`${API}/booking-options${q}`);
    const json = await res.json();
    if(!json.ok){
      app.innerHTML = `<h1>Book an exchange</h1><div class="err-box">${esc(json.message||"This link isn't valid or has expired. Ask Matt for a fresh one.")}</div>`;
      return;
    }
    data = json;
    if(!calYear) calYear = json.calendar_year.year;
    render();
  }catch(e){
    app.innerHTML = '<h1>Book an exchange</h1><div class="err-box">Could not reach the server.</div>';
  }
}

function render(){
  if(view.mode === 'cancel'){ renderCancel(); return; }
  if(view.mode === 'details'){ renderDetails(); return; }
  renderHub();
}

function renderHub(){
  const na = data.next_available;
  const claimMonth = URL_CLAIM && data.calendar_year ? URL_CLAIM : null;
  const claimLabel = claimMonth ? monthLabelFromValue(claimMonth) : null;
  app.innerHTML = `
    <h1>${esc(data.cong_name)}</h1>
    <p class="sub">Booking with Darlington West. Link valid until ${esc(data.valid_until)}.</p>
    <div id="banner"></div>

    ${claimMonth ? `
    <div class="hero" style="background:#fbeee6;border-color:#e8c9a8">
      <div class="eyebrow" style="color:#b4632a">⚡ Date just opened up</div>
      <h2 style="color:#b4632a">${esc(claimLabel)} is available</h2>
      <div class="open-count">A congregation cancelled, so this month is free for an exchange — first come, first served.</div>
      <button id="claimBook">Claim ${esc(claimLabel)}</button>
    </div>` : ''}

    ${na ? `
    <div class="hero">
      <div class="eyebrow">Next available month</div>
      <h2>${esc(na.label)}</h2>
      <div class="open-count">${na.open_count} of the month's Sundays currently open</div>
      <button id="heroBook">Request ${esc(na.label)}</button>
    </div>` : `<div class="card"><p class="sub" style="margin:0">No open months found in the next 6 years — that shouldn't happen, let Matt know.</p></div>`}

    <div class="card">
      <h2>Pick a different month</h2>
      <div class="cal-nav">
        <button class="secondary small" id="calPrev">&larr; ${calYear-1}</button>
        <div class="cal-year">${calYear}</div>
        <button class="secondary small" id="calNext">${calYear+1} &rarr;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i style="background:var(--avail-bg);border:1px solid #cfe3d5"></i>Open</span>
        <span><i style="background:var(--taken-bg)"></i>Already exchanging</span>
        <span><i style="background:var(--cooldown-bg)"></i>Too close to another exchange</span>
        <span><i style="background:var(--past-bg)"></i>Past</span>
      </div>
      <div id="previewArea"></div>
    </div>

    <div class="card">
      <h2>Your current bookings with us</h2>
      ${data.current_exchanges.length ? `
        <select class="booking-select" id="bookingSelect">
          <option value="">Select a month…</option>
          ${data.current_exchanges.map(b=>`<option value="${b.mx_id}" ${expandedBooking===b.mx_id?'selected':''}>${esc(b.month_label)} — ${b.status==='pencilled'?'Pencilled, awaiting confirmation':'Confirmed'}</option>`).join('')}
        </select>
        <div id="bookingDetail"></div>
      ` : `<p class="sub" style="margin:0">Nothing currently booked with us.</p>`}
    </div>

    <p class="sub"><a class="link-btn" id="detailsLink">Update your congregation's coordinator, email or phone details</a></p>
  `;

  document.getElementById('detailsLink').addEventListener('click', ()=>{ view={mode:'details'}; render(); scrollToTop(); });
  const claimBtn = document.getElementById('claimBook');
  if(claimBtn) claimBtn.addEventListener('click', ()=>submitBooking(URL_CLAIM));
  if(na) document.getElementById('heroBook').addEventListener('click', ()=>submitBooking(na.value));
  document.getElementById('calPrev').addEventListener('click', ()=>{ calYear--; load(calYear); });
  document.getElementById('calNext').addEventListener('click', ()=>{ calYear++; load(calYear); });
  renderCalGrid();
  if(selectedPreviewMonth) renderPreview();

  const sel = document.getElementById('bookingSelect');
  if(sel){
    sel.addEventListener('change', e=>{ expandedBooking = e.target.value || null; renderBookingDetail(); });
    if(expandedBooking) renderBookingDetail();
  }
  if(URL_MODE === 'speakers' && expandedBooking && !scrolledToSpeakers){
    scrolledToSpeakers = true;
    setTimeout(()=>{ const el = document.getElementById('speakerSection'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 50);
  }
}

function renderCalGrid(){
  const grid = document.getElementById('calGrid');
  const todayYM = new Date().toISOString().slice(0,7);
  grid.innerHTML = data.calendar_year.months.map(m=>{
    const isSelected = selectedPreviewMonth === m.value;
    return `<div class="cal-month ${m.status}${isSelected?' selected':''}" data-value="${m.value}" data-status="${m.status}">${m.label}</div>`;
  }).join('');
  grid.querySelectorAll('.cal-month.available').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedPreviewMonth = el.dataset.value;
      load(calYear, selectedPreviewMonth);
    });
  });
}

function renderPreview(){
  const area = document.getElementById('previewArea');
  const mp = data.month_preview;
  if(!mp){ area.innerHTML=''; return; }
  area.innerHTML = `
    <div class="preview">
      <h2 style="font-size:16px">${esc(mp.label)}</h2>
      ${mp.sundays.map(s=>`<div class="sun-row"><span>${esc(s.label)}</span>${s.blocked?`<span class="blocked">blocked — ${esc(s.reason)}</span>`:'<span style="color:var(--ok)">open</span>'}</div>`).join('')}
      <div class="action-row">
        <button id="previewBook">Request ${esc(mp.label)}</button>
        <button class="secondary" id="previewClose">Close</button>
      </div>
    </div>`;
  document.getElementById('previewBook').addEventListener('click', ()=>submitBooking(mp.value));
  document.getElementById('previewClose').addEventListener('click', ()=>{ selectedPreviewMonth=null; render(); });
}

async function submitBooking(month){
  const btn = event.target; btn.disabled = true;
  try{
    const res = await fetch(`${API}/booking-submit`, { method:'POST', body: new URLSearchParams({ t: TOKEN, month, blocked: '[]' }) });
    const j = await res.json();
    banner(j.ok, j.message);
    if(j.ok){ selectedPreviewMonth=null; await load(calYear); scrollToTop(); }
    else btn.disabled = false;
  }catch(e){ banner(false, 'Could not reach the server.'); btn.disabled=false; }
}

const SLOT_LABEL = {
  no_speaker: 'No speaker needed',
  dw_local: 'DW has a local speaker — nothing needed from you',
  two_way: 'Exchange both ways',
  visiting_only: 'DW speaker visiting you',
  sending_only: 'Your speaker visiting DW',
};

function renderBookingDetail(){
  const area = document.getElementById('bookingDetail');
  if(!expandedBooking){ area.innerHTML=''; return; }
  const b = data.current_exchanges.find(x=>x.mx_id===expandedBooking);
  if(!b){ area.innerHTML=''; return; }

  const checkDone = b.blocked_dates_partner_check;
  const openF3 = b.sundays.filter(s => !s.blocked_reason && (s.kind==='two_way'||s.kind==='sending_only') && !s.sending_speaker);

  area.innerHTML = `
    <span class="detail-status ${b.status}">${b.status==='pencilled'?'Pencilled':'Confirmed'}</span>
    <div class="check-row ${checkDone?'done':'pending'}">
      ${checkDone ? '✓ Your blocked dates are confirmed for this month' : '⚠ Blocked dates not yet confirmed for this month'}
    </div>
    ${b.sundays.map(s=>`
      <div class="slot-row">
        <span>${esc(s.label)}</span>
        <span class="slot-tag ${s.kind}">
          ${s.blocked_reason ? esc(s.blocked_reason) + ' — ' : ''}${esc(describeSlot(s))}
        </span>
      </div>`).join('')}

    <div class="add-block">
      <label>Flag a date this month you can't do</label>
      <div class="row">
        <select id="blockDate">
          <option value="">Pick a Sunday…</option>
          ${b.sundays.filter(s=>!s.blocked_reason).map(s=>`<option value="${s.date}">${esc(s.label)}</option>`).join('')}
        </select>
        <input type="text" id="blockNote" placeholder="Reason (optional)">
      </div>
      <button class="secondary small" id="addBlockBtn">Add blocked date</button>
    </div>

    ${openF3.length ? `
    <div class="add-block" id="speakerSection">
      <label>Add your speaker for these dates</label>
      <p class="sub" style="margin:0 0 10px">Please select from the dropdown — only type a name if your speaker isn't listed.</p>
      ${openF3.map(s=>`
        <div class="spk-row" data-date="${s.date}" style="border:1px solid var(--rule);border-radius:6px;padding:10px;margin-bottom:10px">
          <div style="font-size:13.5px;font-weight:600;margin-bottom:6px">${esc(s.label)}</div>
          <select class="spk-select" data-date="${s.date}">
            <option value="">Select speaker…</option>
            ${data.partner_speakers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
            <option value="__new__">— Speaker not listed —</option>
          </select>
          <input type="text" class="spk-name" data-date="${s.date}" placeholder="Speaker's name" style="display:none;margin-top:8px">
          <select class="spk-talk" data-date="${s.date}" style="margin-top:8px">
            <option value="">Select speaker first…</option>
          </select>
          <div class="spk-error" data-date="${s.date}" style="color:var(--bad);font-size:12.5px;margin-top:6px;display:none"></div>
        </div>
      `).join('')}
      <button id="submitSpeakersBtn" disabled>Save speaker details</button>
    </div>` : ''}

    <div class="action-row">
      ${!checkDone ? `<button id="confirmDoneBtn">Confirm — that's everything blocked</button>` : ''}
      <button class="danger" id="cancelBookingBtn">Request cancellation</button>
    </div>
  `;

  document.getElementById('addBlockBtn').addEventListener('click', async ()=>{
    const date = document.getElementById('blockDate').value;
    const note = document.getElementById('blockNote').value;
    if(!date){ banner(false, 'Pick a Sunday first.'); return; }
    const btn = document.getElementById('addBlockBtn'); btn.disabled = true;
    try{
      const res = await fetch(`${API}/booking-blocked-date`, { method:'POST', body: new URLSearchParams({ t: TOKEN, mx: expandedBooking, action: 'add', date, note }) });
      const j = await res.json();
      banner(j.ok, j.message);
      if(j.ok) await load(calYear);
    }catch(e){ banner(false, 'Could not reach the server.'); }
    btn.disabled = false;
  });

  const confirmBtn = document.getElementById('confirmDoneBtn');
  if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
    confirmBtn.disabled = true;
    try{
      const res = await fetch(`${API}/booking-blocked-date`, { method:'POST', body: new URLSearchParams({ t: TOKEN, mx: expandedBooking, action: 'confirm' }) });
      const j = await res.json();
      banner(j.ok, j.message);
      if(j.ok) await load(calYear);
    }catch(e){ banner(false, 'Could not reach the server.'); confirmBtn.disabled=false; }
  });

  document.getElementById('cancelBookingBtn').addEventListener('click', ()=>{
    view = { mode: 'cancel', mx: expandedBooking };
    render();
    scrollToTop();
  });

  if(openF3.length) wireSpeakerSection(b);
}

function wireSpeakerSection(b){
  const rows = [...document.querySelectorAll('.spk-row')];

  function talkOptionsFor(speakerId, isNew){
    if(isNew) return data.all_active_talks;
    const p = data.partner_speakers.find(x=>x.id===speakerId);
    return p ? p.talks : [];
  }

  function populateTalkSelect(row, speakerId, isNew){
    const talkSel = row.querySelector('.spk-talk');
    const opts = talkOptionsFor(speakerId, isNew);
    talkSel.innerHTML = opts.length
      ? `<option value="">Select talk…</option>` + opts.map(n=>`<option value="${n}">${n}</option>`).join('')
      : `<option value="">No talks on file for this speaker</option>`;
  }

  rows.forEach(row=>{
    const select = row.querySelector('.spk-select');
    const nameInput = row.querySelector('.spk-name');
    select.addEventListener('change', ()=>{
      const isNew = select.value === '__new__';
      nameInput.style.display = isNew ? 'block' : 'none';
      populateTalkSelect(row, select.value, isNew);
      validateSpeakerSection();
    });
    nameInput.addEventListener('input', validateSpeakerSection);
    row.querySelector('.spk-talk').addEventListener('change', validateSpeakerSection);
  });

  document.getElementById('submitSpeakersBtn').addEventListener('click', async ()=>{
    const entries = rows.map(row=>{
      const date = row.dataset.date;
      const select = row.querySelector('.spk-select');
      const isNew = select.value === '__new__';
      const talk = row.querySelector('.spk-talk').value;
      const entry = { date, talk_number: Number(talk) };
      if(isNew) entry.new_speaker_name = row.querySelector('.spk-name').value.trim();
      else entry.speaker_id = select.value;
      return entry;
    }).filter(e => e.speaker_id || e.new_speaker_name);
    if(!entries.length) return;
    const btn = document.getElementById('submitSpeakersBtn'); btn.disabled = true;
    try{
      const res = await fetch(`${API}/booking-speaker-talk`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ t: TOKEN, mx: expandedBooking, entries }) });
      const j = await res.json();
      banner(j.ok, j.message);
      if(j.ok) await load(calYear);
      else btn.disabled = false;
    }catch(e){ banner(false, 'Could not reach the server.'); btn.disabled=false; }
  });

  validateSpeakerSection();
}

function validateSpeakerSection(){
  const rows = [...document.querySelectorAll('.spk-row')];
  const submitBtn = document.getElementById('submitSpeakersBtn');
  if(!submitBtn) return;

  const usedSpeakerIds = new Set(); const usedTalks = new Set();
  const alreadyFilledSpeakers = new Set(currentBookingFilledSpeakerIds());
  const alreadyFilledTalks = new Set(currentBookingFilledTalkNumbers());
  let anyFilled = false, allValid = true;

  rows.forEach(row=>{
    const date = row.dataset.date;
    const select = row.querySelector('.spk-select');
    const nameInput = row.querySelector('.spk-name');
    const talkSel = row.querySelector('.spk-talk');
    const errEl = row.querySelector('.spk-error');
    const isNew = select.value === '__new__';
    const hasSpeaker = isNew ? nameInput.value.trim().length > 1 : !!select.value;
    const hasTalk = !!talkSel.value;
    let err = '';

    if(!select.value && !talkSel.value){ errEl.style.display='none'; return; } // untouched row, fine to leave blank
    anyFilled = true;

    if(!hasSpeaker) err = 'Select a speaker or enter a name.';
    else if(!hasTalk) err = 'Select a talk.';
    else if(!isNew){
      if(alreadyFilledSpeakers.has(select.value) || usedSpeakerIds.has(select.value)) err = 'This speaker is already assigned to another date this month.';
      else usedSpeakerIds.add(select.value);
    }
    if(!err && hasTalk){
      const talkNum = Number(talkSel.value);
      if(alreadyFilledTalks.has(talkNum) || usedTalks.has(talkNum)) err = 'This talk is already assigned to another date this month.';
      else usedTalks.add(talkNum);
    }

    if(err){ errEl.textContent = err; errEl.style.display='block'; allValid = false; }
    else errEl.style.display='none';
  });

  submitBtn.disabled = !(anyFilled && allValid);
}

function currentBookingFilledSpeakerIds(){
  const b = data.current_exchanges.find(x=>x.mx_id===expandedBooking);
  return b ? b.filled_f3_speaker_ids : [];
}
function currentBookingFilledTalkNumbers(){
  const b = data.current_exchanges.find(x=>x.mx_id===expandedBooking);
  return b ? b.filled_f3_talk_numbers : [];
}

function describeSlot(s){
  if(s.blocked_reason) return SLOT_LABEL[s.kind] || '';
  if(s.kind === 'two_way') return [s.visiting_speaker?`DW: ${s.visiting_speaker}`:'DW: open', s.sending_speaker?`You: ${s.sending_speaker}`:'You: open'].join(' · ');
  if(s.kind === 'visiting_only') return s.visiting_speaker ? `DW: ${s.visiting_speaker}` : 'DW speaker — open';
  if(s.kind === 'sending_only') return s.sending_speaker ? `You: ${s.sending_speaker}` : 'Your speaker — open';
  return SLOT_LABEL[s.kind] || '';
}

// ── Cancel view ─────────────────────────────────────────────────────────
async function renderCancel(){
  app.innerHTML = '<div class="loading">Loading…</div>';
  try{
    const res = await fetch(`${API}/booking-exchange-detail?t=${encodeURIComponent(TOKEN)}&mx=${encodeURIComponent(view.mx)}`);
    const j = await res.json();
    if(!j.ok){ app.innerHTML = `<h1>Cancel booking</h1><div class="err-box">${esc(j.message)}</div>`; return; }
    app.innerHTML = `
      <a class="link-btn" id="backLink">&larr; back</a>
      <h1>Cancel ${esc(j.month_label)}</h1>
      <p class="sub">${esc(j.cong_name)} ⇄ Darlington West</p>
      <div id="banner"></div>
      <div class="card">
        <label>Reason for cancelling</label>
        <textarea id="cancelReason" rows="4" placeholder="Let us know what's changed…"></textarea>
        <div class="action-row">
          <button class="danger" id="cancelSubmitBtn">Confirm cancellation</button>
          <button class="secondary" id="cancelBackBtn">Never mind</button>
        </div>
      </div>`;
    document.getElementById('backLink').addEventListener('click', backToHub);
    document.getElementById('cancelBackBtn').addEventListener('click', backToHub);
    document.getElementById('cancelSubmitBtn').addEventListener('click', async ()=>{
      const reason = document.getElementById('cancelReason').value.trim();
      if(!reason){ banner(false, 'A reason is required.'); return; }
      const btn = document.getElementById('cancelSubmitBtn'); btn.disabled = true;
      try{
        const res = await fetch(`${API}/booking-cancel-request`, { method:'POST', body: new URLSearchParams({ t: TOKEN, mx: view.mx, reason }) });
        const jr = await res.json();
        banner(jr.ok, jr.message);
        if(jr.ok) setTimeout(backToHub, 1400);
        else btn.disabled = false;
      }catch(e){ banner(false, 'Could not reach the server.'); btn.disabled=false; }
    });
  }catch(e){ app.innerHTML = '<h1>Cancel booking</h1><div class="err-box">Could not reach the server.</div>'; }
}
function backToHub(){ view = { mode: 'hub' }; expandedBooking = view.mx; load(calYear); }

// ── Congregation details view ──────────────────────────────────────────
function renderDetails(){
  app.innerHTML = `
    <a class="link-btn" id="backLink">&larr; back</a>
    <h1>Update your details</h1>
    <p class="sub">Let us know if anything's changed — we'll confirm before anything is updated on our side.</p>
    <div id="banner"></div>
    <div class="card">
      <label>Coordinator's first name (if it's changed)</label>
      <input type="text" id="detFirst" placeholder="Leave blank if unchanged">
      <div style="height:10px"></div>
      <label>Coordinator's surname</label>
      <input type="text" id="detSurname" placeholder="Leave blank if unchanged">
      <div style="height:10px"></div>
      <label>Coordinator's email</label>
      <input type="text" id="detEmail" placeholder="Leave blank if unchanged">
      <div style="height:10px"></div>
      <label>Coordinator's mobile number</label>
      <input type="text" id="detPhone" placeholder="Leave blank if unchanged">
      <div style="height:10px"></div>
      <label>Congregation image/streaming email (if it's changed)</label>
      <input type="text" id="detImageEmail" placeholder="Leave blank if unchanged">
      <div class="action-row">
        <button id="detSubmitBtn">Send update</button>
        <button class="secondary" id="detBackBtn">Never mind</button>
      </div>
    </div>`;
  document.getElementById('backLink').addEventListener('click', backToHub);
  document.getElementById('detBackBtn').addEventListener('click', backToHub);
  document.getElementById('detSubmitBtn').addEventListener('click', async ()=>{
    const firstname = document.getElementById('detFirst').value.trim();
    const surname = document.getElementById('detSurname').value.trim();
    const email = document.getElementById('detEmail').value.trim();
    const phone = document.getElementById('detPhone').value.trim();
    const image_email = document.getElementById('detImageEmail').value.trim();
    if(!firstname && !surname && !email && !phone && !image_email){ banner(false, "Let us know what's changed first."); return; }
    const btn = document.getElementById('detSubmitBtn'); btn.disabled = true;
    try{
      const res = await fetch(`${API}/booking-cong-details`, { method:'POST', body: new URLSearchParams({ t: TOKEN, firstname, surname, email, phone, image_email }) });
      const j = await res.json();
      banner(j.ok, j.message);
      if(j.ok) setTimeout(backToHub, 1400); else btn.disabled = false;
    }catch(e){ banner(false, 'Could not reach the server.'); btn.disabled=false; }
  });
}

function banner(ok, msg){
  const el = document.getElementById('banner');
  if(!el || !msg) return;
  el.innerHTML = `<div class="banner ${ok?'ok':'err'}">${esc(msg)}</div>`;
}
function scrollToTop(){ window.scrollTo({top:0, behavior:'smooth'}); }

load();
